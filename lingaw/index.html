<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovering the Beauty of the 7 Elements of Art</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">A field guide for young artists</p>
    <h1>Discovering the Beauty of the 7 Elements of Art</h1>
    <p>Every drawing, painting, or sculpture is built from the same seven ingredients. Tap a card to see what each one does and how artists use it.</p>
  </header>

  <div class="grid" id="grid"></div>

  <footer>Tap any card to open or close it — start wherever you like.</footer>
</div>

<script>
const elements = [
  {
    name:"Line", n:"1",
    caption:"A mark that travels — straight, curved, thick, thin, jagged.",
    detail:"Lines lead the eye and set mood: horizontal lines feel calm, diagonals feel active, jagged lines feel tense. Artists use line to define edges, build texture, and create movement before any color is added.",
    icon:`<svg class="icon" viewBox="0 0 200 90"><line x1="10" y1="15" x2="60" y2="70"/><line x1="25" y1="10" x2="75" y2="65"/><line x1="40" y1="10" x2="90" y2="60"/><path d="M100 65 Q120 15 140 65 Q160 15 180 65" /><path d="M100 25 L112 40 L100 55 L112 70 L100 82" /></svg>`
  },
  {
    name:"Shape", n:"2",
    caption:"A flat, enclosed area — geometric or organic.",
    detail:"Shapes are two-dimensional and defined by boundaries. Geometric shapes (squares, circles, triangles) feel ordered and man-made; organic shapes feel natural and free-form. Combining both creates visual contrast.",
    icon:`<svg class="icon" viewBox="0 0 200 90"><rect x="15" y="20" width="45" height="45"/><circle cx="100" cy="42" r="23"/><polygon points="150,20 175,65 125,65"/></svg>`
  },
  {
    name:"Form", n:"3",
    caption:"A shape with volume — it has depth, like a real object.",
    detail:"Form is three-dimensional: it can be measured in height, width, and depth. Artists suggest form on a flat surface through shading, perspective, and highlights, making a circle read as a sphere or a square as a cube.",
    icon:`<svg class="icon" viewBox="0 0 200 90"><path d="M20 20 L55 20 L65 30 L65 65 L30 65 L20 55 Z"/><path d="M20 20 L30 30 M55 20 L65 30 M20 55 L30 65"/><circle cx="105" cy="42" r="23"/><path d="M85 42 Q105 55 125 42" stroke-dasharray="2 3"/><path d="M150 65 L150 30 L172 20 L172 55 Z"/><ellipse cx="161" cy="30" rx="11" ry="5"/></svg>`
  },
  {
    name:"Space", n:"4",
    caption:"The area around, between, and within objects.",
    detail:"Space can be positive (occupied by a subject) or negative (the empty area around it). Artists use overlap, size, and perspective lines to create the illusion of depth on a flat page.",
    icon:`<svg class="icon" viewBox="0 0 200 90"><path d="M20 20 L80 65 M80 20 L20 65"/><path d="M100 65 L120 25 L140 65 Z"/><path d="M108 65 L128 30 L148 65 Z" stroke-dasharray="2 3"/><path d="M160 65 L160 30 L180 20 L180 55 Z"/></svg>`
  },
  {
    name:"Color", n:"5",
    caption:"Hue, value, and intensity — how light behaves on a surface.",
    detail:"Color has three properties: hue (the name, like red or blue), value (light or dark), and intensity (bright or dull). Warm colors advance and feel energetic; cool colors recede and feel calm.",
    icon:`<svg class="icon" viewBox="0 0 200 90"><circle cx="55" cy="42" r="28" class="fill-accent" opacity="0.85"/><circle cx="95" cy="42" r="28" class="fill-accent2" opacity="0.85"/><circle cx="75" cy="20" r="28" fill="#c9a04a" opacity="0.75" stroke="none"/></svg>`
  },
  {
    name:"Texture", n:"6",
    caption:"How a surface looks or feels — rough, smooth, soft.",
    detail:"Texture can be actual (you can touch it, like impasto paint) or implied (drawn to look like a texture, such as wood grain or fabric weave). It adds sensory realism and visual interest.",
    icon:`<svg class="icon" viewBox="0 0 200 90"><rect x="15" y="15" width="55" height="55"/><path d="M15 15 L70 70 M15 30 L55 70 M15 45 L40 70 M30 15 L70 55 M45 15 L70 40"/><circle cx="130" cy="42" r="27"/><path d="M108 42 h44 M130 18 v48 M114 25 L146 59 M146 25 L114 59"/></svg>`
  },
  {
    name:"Value", n:"7",
    caption:"The lightness or darkness of a color or tone.",
    detail:"Value creates contrast, form, and mood. A full range from white to black lets artists build the illusion of light hitting a three-dimensional surface, and guides the viewer's eye to a focal point.",
    icon:`<svg class="icon" viewBox="0 0 200 90"><rect x="15" y="20" width="18" height="45" fill="#efe8d6" stroke="var(--ink)"/><rect x="35" y="20" width="18" height="45" fill="#c9bfa2" stroke="var(--ink)"/><rect x="55" y="20" width="18" height="45" fill="#8f8368" stroke="var(--ink)"/><rect x="75" y="20" width="18" height="45" fill="#4c452f" stroke="var(--ink)"/><rect x="95" y="20" width="18" height="45" fill="#1c1811" stroke="var(--ink)"/><circle cx="150" cy="42" r="27"/><path d="M150 15 A27 27 0 0 1 150 69 Z" class="fill-accent" opacity="0.5" stroke="none"/></svg>`
  }
];

const grid = document.getElementById('grid');
elements.forEach(el=>{
  const card = document.createElement('div');
  card.className = 'card';
  card.tabIndex = 0;
  card.setAttribute('role','button');
  card.setAttribute('aria-expanded','false');
  card.innerHTML = `
    <div class="toggle">▾</div>
    <div class="card-top">
      <p class="card-name">${el.name}</p>
      <span class="card-num">${el.n}/7</span>
    </div>
    ${el.icon}
    <p class="caption">${el.caption}</p>
    <div class="detail"><div class="detail-inner">${el.detail}</div></div>
  `;
  function toggle(){
    const open = card.classList.toggle('open');
    card.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  card.addEventListener('click', toggle);
  card.addEventListener('keydown', e=>{
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggle(); }
  });
  grid.appendChild(card);
});
</script>
</body>
</html>
